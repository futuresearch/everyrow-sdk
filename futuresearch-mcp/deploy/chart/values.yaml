nameOverride: ""
fullnameOverride: ""

image:
  repository: us-central1-docker.pkg.dev/varuna-400921/delphos/futuresearch-mcp
  pullPolicy: IfNotPresent

# Release identifier (tag). The workflow sets this via --set-string releaseId=<sha>
releaseId: "latest"

# OAuth state is stored in Redis. Multiple replicas are possible.
replicaCount: 2

service:
  port: 80
  targetPort: 8000

resources:
  limits:
    cpu: "1000m"
    memory: 2Gi
  requests:
    cpu: "200m"
    memory: 512Mi

env:
  MCP_SERVER_URL: "https://mcp.futuresearch.ai"
  # Engine calls stay on the cluster network rather than round-tripping
  # through the public hostname and the edge. NOTE: if networkPolicy.enabled
  # is ever flipped on, its egress rules must allow the cohort namespace on
  # 8000 — the current 443-only external rule does not cover this.
  FUTURESEARCH_API_URL: "http://cohort-engine.cohort.svc.cluster.local:8000/api/v0"
  # Rate limiter OFF (2026-08-03, launch day).
  #
  # RateLimitMiddleware keys on `get_client_ip()`, which falls back to the
  # direct peer IP unless `trust_proxy_headers` is true. Behind our ingress
  # the peer is always a Traefik pod, so the default 100 req/60s was a
  # PLATFORM-WIDE budget of ~100/min per Traefik replica rather than a
  # per-client one. Launch traffic saturated it: at 20:38 UTC the server
  # served 0 successful requests and rejected 1140 with 429, and the
  # everyrow-cc agent's MCP handshake failed, so users' sessions came up
  # with no futuresearch tools at all ("No such tool available").
  #
  # Turned off rather than raised because any IP-keyed number is wrong
  # while every client shares one bucket. Re-enable together with
  # TRUST_PROXY_HEADERS=true (so the limit keys on the real client) or a
  # limiter keyed on the authenticated account.
  RATE_LIMIT_ENABLED: "false"
  REDIS_DB: "13"
  SUPABASE_URL: "https://iliivszxpymuffgrwsws.supabase.co"
  REDIS_SENTINEL_ENDPOINTS: "albert-valkey.utils.svc.cluster.local:26379"
  REDIS_SENTINEL_MASTER_NAME: "mymaster"
  SENTRY_ENVIRONMENT: "production"
  # Discoverability: claims our listing on Glama.ai (which feeds part of
  # the awesome-mcp-servers GitHub list) by publishing the maintainer
  # email at https://mcp.futuresearch.ai/.well-known/glama.json.
  GLAMA_MAINTAINER_EMAIL: "jack@futuresearch.ai"

httproute:
  host: mcp.futuresearch.ai

# Session affinity — defense-in-depth for multi-replica deployments.
# The server runs in stateless HTTP mode so affinity is NOT required,
# but it reduces unnecessary cross-pod hops.
sessionAffinity:
  # GCPBackendPolicy: cookie-based affinity at the GKE load-balancer layer.
  gcpBackendPolicy:
    enabled: true
    cookieTtlSec: 3600
  # Service-level ClientIP affinity: kube-proxy layer fallback.
  clientIP:
    enabled: true
    timeoutSeconds: 3600

deployment:
  maxSurge: "50%"
  maxUnavailable: "25%"

secrets:
  enabled: true

# NetworkPolicy: restrict pod ingress/egress.
# gatewayNamespace must match the namespace where gateway data-plane proxy
# pods run — verify with: kubectl get pods -A | grep gateway
#
# redisCIDRs: Production uses Redis Sentinel (cross-namespace/external).
# List every Sentinel + master IP here. Use "kubectl get endpoints" or
# check REDIS_SENTINEL_ENDPOINTS to find the IPs, then narrow the CIDRs.
networkPolicy:
  enabled: false
  gatewayNamespace: gke-managed-system
  redisPort: 6379
  redisSentinelPort: 26379
  redisCIDRs:
    - 10.0.0.0/8       # Pod network
    - 34.118.224.0/20   # GKE service CIDR (covers ClusterIP 34.118.226.16)

tolerations:
  - key: "hyperdiskonly"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: hyperdiskonly
              operator: In
              values:
                - "true"
